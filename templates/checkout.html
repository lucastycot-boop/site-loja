<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamento Seguro - Espaço Vanessa Cubula</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #f9f9f9; color: #111; }
        .bg-boutique-black { background-color: #111111; }
        .text-pink { color: #ff007f; }
        .btn-pink { background-color: #ff007f; color: white; font-weight: 700; border: none; transition: all 0.3s; }
        .btn-pink:hover { background-color: #d40069; color: white; }
        .nav-pills .nav-link { color: #111; font-weight: 600; border: 2px solid #111; margin: 0 5px; border-radius: 30px; }
        .nav-pills .nav-link.active { background-color: #ff007f !important; border-color: #ff007f !important; color: white; }
        .card-custom { border-radius: 16px; border: none; box-shadow: 0 4px 20px rgba(0,0,0,0.04); }
        .form-control { border-radius: 8px; padding: 12px; }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark bg-boutique-black py-3 mb-5">
        <div class="container justify-content-center">
            <span class="navbar-brand fw-bold text-uppercase" style="letter-spacing: 2px;">
                Espaço <span class="text-pink">Vanessa Cubula</span>
            </span>
        </div>
    </nav>

    <div class="container">
        <div class="row g-4 justify-content-center">
            <div class="col-12 col-lg-6">
                <div class="card card-custom p-4 bg-white">
                    <h4 class="fw-bold mb-4 text-center"><i class="bi bi-credit-card text-pink"></i> Detalhes do Pagamento</h4>
                    <p class="text-center text-muted small mb-4">Valor a ser cobrado: <span class="fw-bold text-dark">R$ {{ "%.2f"|format(total) }}</span></p>

                    <ul class="nav nav-pills mb-4 justify-content-center" id="pills-tab" role="tablist">
                        <li class="nav-item">
                            <button class="nav-link active" id="pills-cartao-tab" data-bs-toggle="pill" data-bs-target="#pills-cartao" type="button" role="tab">Cartão de Crédito</button>
                        </li>
                        <li class="nav-item">
                            <button class="nav-link" id="pills-pix-tab" data-bs-toggle="pill" data-bs-target="#pills-pix" type="button" role="tab">PIX</button>
                        </li>
                    </ul>

                    <div class="tab-content" id="pills-tabContent">
                        <div class="tab-pane fade show active" id="pills-cartao" role="tabpanel">
                            <form action="/carrinho/simular-pedido" method="POST">
                                <div class="mb-3">
                                    <label class="form-label small fw-bold text-muted">Número do Cartão</label>
                                    <input type="text" class="form-control" placeholder="0000 0000 0000 0000" required>
                                </div>
                                <div class="row">
                                    <div class="col-6 mb-3">
                                        <label class="form-label small fw-bold text-muted">Validade</label>
                                        <input type="text" class="form-control" placeholder="MM/AA" required>
                                    </div>
                                    <div class="col-6 mb-3">
                                        <label class="form-label small fw-bold text-muted">CVV</label>
                                        <input type="text" class="form-control" placeholder="123" required>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label small fw-bold text-muted">Nome do Titular</label>
                                    <input type="text" class="form-control" placeholder="Como no cartão" required>
                                </div>
                                <button type="submit" class="btn btn-pink w-100 py-3 text-uppercase mt-2">Confirmar Pagamento</button>
                            </form>
                        </div>

                        <div class="tab-pane fade" id="pills-pix" role="tabpanel">
                            <form action="/carrinho/simular-pedido" method="POST">
                                <div class="text-center py-3">
                                    <i class="bi bi-lightning-charge-fill text-warning display-4 mb-2 d-block"></i>
                                    <h5>Pagar via Código PIX</h5>
                                    <p class="text-muted small px-3">O QR Code dinâmico e o código copia-e-cola serão criados na tela de rastreamento.</p>
                                    <button type="submit" class="btn btn-pink w-100 py-3 text-uppercase mt-2">Gerar Código PIX</button>
                                </div>
                            </form>
                        </div>
                    </div>

                </div>
                <div class="text-center mt-3">
                    <a href="/carrinho" class="text-decoration-none text-muted small fw-bold"><i class="bi bi-arrow-left"></i> Voltar para alterar sacola</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
