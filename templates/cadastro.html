<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta - Espaço Vanessa Cubula</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #f4f6f9;
            color: #333;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card-cadastro {
            border: none;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.05);
            max-width: 450px;
            width: 100%;
            background-color: #ffffff;
            padding: 2.5rem;
        }
        .btn-pink {
            background-color: #ff007f;
            color: white;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            transition: all 0.3s;
        }
        .btn-pink:hover {
            background-color: #d40069;
            color: white;
        }
        .text-pink {
            color: #ff007f;
        }
        .form-control:focus {
            border-color: #ff007f;
            box-shadow: 0 0 0 0.25rem rgba(255, 0, 127, 0.25);
        }
    </style>
</head>
<body>

    <div class="card-cadastro">
        <div class="text-center mb-4">
            <h2 class="fw-bold text-uppercase" style="letter-spacing: 2px;">
                Espaço <span class="text-pink">VC</span>
            </h2>
            <p class="text-muted small">Crie a sua conta para gerenciar e rastrear as suas compras</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} small py-2 alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="/cadastro" method="POST">
            <div class="mb-3">
                <label for="nome" class="form-label small fw-semibold text-secondary">Nome Completo</label>
                <input type="text" class="form-control py-2" id="nome" name="nome" placeholder="Seu nome" required>
            </div>

            <div class="mb-3">
                <label for="whatsapp" class="form-label small fw-semibold text-secondary">Número do WhatsApp</label>
                <input type="text" class="form-control py-2" id="whatsapp" name="whatsapp" placeholder="(00) 00000-0000" required>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label small fw-semibold text-secondary">E-mail (Opcional)</label>
                <input type="email" class="form-control py-2" id="email" name="email" placeholder="seuemail@exemplo.com">
            </div>

            <div class="mb-4">
                <label for="senha" class="form-label small fw-semibold text-secondary">Crie uma Senha</label>
                <input type="password" class="form-control py-2" id="senha" name="senha" placeholder="Sua senha" required>
            </div>

            <button type="submit" class="btn btn-pink w-100 py-2.5 text-uppercase fw-bold mb-3" style="letter-spacing: 1px;">
                Cadastrar
            </button>

            <div class="text-center small">
                <span class="text-muted">Já tem uma conta?</span>
                <a href="/login" class="text-pink fw-semibold text-decoration-none">Fazer Login</a>
            </div>
        </form>
    </div>

    <script>
        const inputWhatsapp = document.getElementById('whatsapp');
        inputWhatsapp.addEventListener('input', (e) => {
            let value = e.target.value.replace(/\D/g, "");
            if (value.length > 11) value = value.slice(0, 11);

            if (value.length > 6) {
                e.target.value = `(${value.slice(0, 2)}) ${value.slice(2, 7)}-${value.slice(7)}`;
            } else if (value.length > 2) {
                e.target.value = `(${value.slice(0, 2)}) ${value.slice(2)}`;
            } else if (value.length > 0) {
                e.target.value = `(${value}`;
            } else {
                e.target.value = "";
            }
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
